# oapi-codegen configuration. Run through `make generate`; do not edit gen.go by hand.
package: gen
generate:
  std-http-server: true
  strict-server: true
  models: true
  # GetSwagger: the contract, embedded so the server validates every request
  # against it (internal/httpapi/validate.go).
  embedded-spec: true
output: gen.go
output-options:
  skip-prune: false
  # Nullable fields become nullable.Nullable[T], which tells an omitted field
  # (unchanged) apart from an explicit null (clear a secret).
  nullable-type: true
