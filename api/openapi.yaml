        attempts:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        next_attempt_at:
          type: string
          format: date-time
          description: Present while pending.
        finished_at:
          type: string
          format: date-time
        last_status:
          type: integer
          description: The receiver's last HTTP status, if it answered.
        last_error:
          type: string
    NotificationList:
      type: object
      required: [notifications]
      additionalProperties: false
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
    NotificationTestResult:
      type: object
      required: [ok, message]
      additionalProperties: false
      properties:
        ok:
          type: boolean
        status_code:
          type: integer
        message:
          type: string
    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
    SetupState:
      type: string
      description: |
        `setup_required` while the first-run wizard has not been completed;
        `ready` once an administrator has finished setup.
      enum: [setup_required, ready]
    Meta:
      type: object
      required: [version, setupState, instanceName, devLogin]
      additionalProperties: false
      properties:
        version:
          type: string
          description: Version of the running binary.
          examples: [v0.1.0]
        setupState:
          $ref: "#/components/schemas/SetupState"
        instanceName:
          type: string
          description: The instance name, shown on the sign-in page.
        devLogin:
          type: boolean
          description: True in `--dev` mode, where POST /api/dev/login is available.
