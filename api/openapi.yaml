        link. `error`: the check could not run.
      required: [state, checked]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [none, running, done, error]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        checked:
          type: integer
          format: int64
          description: Events checked so far.
        last_seq:
          type: integer
          format: int64
        ok:
          type: boolean
        problem:
          $ref: "#/components/schemas/AuditProblem"
        message:
          type: string
        last_success:
          $ref: "#/components/schemas/AuditLastSuccess"
    SystemCounts:
      type: object
      required: [users, connections, changes]
      additionalProperties: false
      properties:
        users:
          type: integer
          format: int64
          description: Active users (removed users are not counted).
        connections:
          type: integer
          format: int64
          description: Connections that are not archived.
        changes:
          type: integer
          format: int64
    SystemInfo:
