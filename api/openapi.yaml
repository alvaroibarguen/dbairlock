    ChangePreviewRequest:
      type: object
      required: [connection_id, statements]
      additionalProperties: false
      properties:
        connection_id:
          type: string
          maxLength: 64
        statements:
          $ref: "#/components/schemas/Statements"
    PreviewStatement:
      type: object
      required: [position, sql, valid, has_primary_key]
      additionalProperties: false
      properties:
        position:
          type: integer
        sql:
          type: string
        valid:
          type: boolean
        kind:
          $ref: "#/components/schemas/StatementKind"
        schema:
          type: string
        table:
          type: string
        has_primary_key:
          type: boolean
        issue:
          $ref: "#/components/schemas/ChangeIssue"
        preview:
          $ref: "#/components/schemas/RowPreview"
    ChangeRef:
      type: object
      required: [id, number]
      additionalProperties: false
      properties:
        id:
          type: string
        number:
          type: integer
          format: int64
    ChangePreview:
      type: object
      required: [ok, sql_hash, statements]
      additionalProperties: false
      properties:
