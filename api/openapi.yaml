        needs_my_review:
          type: integer
          description: How many changes wait for the caller's review.
    Statements:
      type: array
      minItems: 1
      maxItems: 20
      items:
        type: string
        maxLength: 65536
    ChangeCreate:
      type: object
      required: [connection_id, title, statements]
      additionalProperties: false
      properties:
        connection_id:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 1000
        reason:
          type: string
          maxLength: 20000
        statements:
          $ref: "#/components/schemas/Statements"
        submit:
          type: boolean
          description: Submit for review at once instead of saving a draft.
    ChangeUpdate:
      type: object
      required: [revision]
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 1000
        reason:
          type: string
          maxLength: 20000
        statements:
          $ref: "#/components/schemas/Statements"
    ChangeRevision:
      type: object
      required: [revision]
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
    ChangeCancel:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 4000
    ReviewCreate:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
          maxLength: 16000
        sql_hash:
          type: string
          maxLength: 64
          description: Required to approve; the SQL the reviewer is looking at.
        preview_hash:
          type: string
          maxLength: 64
