        problem:
          type: string
    ChangeEventActor:
      type: object
      required: [via]
      additionalProperties: false
      properties:
        user_id:
          type: string
        email:
          type: string
        via:
          type: string
          enum: [web, mcp, cli, system]
        api_token_id:
          type: string
    ChangeEvent:
      type: object
      required: [seq, occurred_at, action, actor, payload]
      additionalProperties: false
      properties:
        seq:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        action:
          type: string
        actor:
          $ref: "#/components/schemas/ChangeEventActor"
        payload:
          type: object
          additionalProperties: true
    ChangeEventList:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ChangeEvent"
    AuditVia:
      type: string
      enum: [web, mcp, cli, system]
    AuditActor:
      type: object
      required: [via]
      additionalProperties: false
      properties:
        user_id:
          type: string
        email:
          type: string
        via:
          $ref: "#/components/schemas/AuditVia"
        api_token_id:
          type: string
        ip:
          type: string
    AuditEvent:
      type: object
      description: |
        One stored event. The payload is data written by dbairlock and may
