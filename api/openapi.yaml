openapi: 3.1.0
info:
  title: dbairlock
  version: 0.1.0
  description: |
    REST API for the dbairlock dashboard. This file is the contract: Go server
    stubs (internal/httpapi/gen) and TypeScript types (web/src/api/schema.d.ts)
    are generated from it with `make generate`. Every error response uses the
    shared Error envelope.
  license:
    name: MIT
    identifier: MIT
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: Returns 200 while the process is running and able to serve HTTP.
      tags: [system]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: Returns 200 when the instance is ready to serve traffic, 503 otherwise.
      tags: [system]
      responses:
        "200":
          description: The instance is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"
  /api/meta:
    get:
      operationId: getMeta
      summary: Instance metadata
      description: Public metadata the dashboard needs before sign-in.
      tags: [system]
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Error"
  /api/setup/verify:
    post:
      operationId: verifySetupCode
      summary: Enter the setup code
      description: |
        Checks the one-time setup code printed in the server log and, if it
        matches, sets a short-lived setup session cookie. Rate limited per
        client address: 5 attempts per minute, then a growing delay (429
        with Retry-After). Only available in setup mode.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCode"
      responses:
        "204":
          description: The code matched; the setup session cookie is set.
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/setup/recover:
    post:
      operationId: verifyRecoveryCode
      summary: Use a recovery code
      description: |
        Checks a one-time recovery code printed by `dbairlock recover` and, if
        it matches and has not expired, consumes it and sets a recovery
        session cookie. The recovery session can only change the sign-in
        settings and confirm them with a sign-in. Rate limited like
        verifySetupCode.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCode"
      responses:
        "204":
          description: The code matched; the recovery session cookie is set.
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/setup/session:
    get:
      operationId: getSetupSession
      summary: Current setup or recovery session
      description: Reports which grant the browser holds, or 401 if none.
      tags: [setup]
      security: []
      responses:
        "200":
          description: The browser holds a valid grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSession"
        default:
          $ref: "#/components/responses/Error"
  /api/setup/signin:
    get:
      operationId: getSetupSignIn
      summary: Sign-in settings for the wizard
      description: Requires a setup or recovery session.
      tags: [setup]
      security: []
      responses:
        "200":
          description: The current sign-in settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSignIn"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putSetupSignIn
      summary: Store the sign-in settings
      description: |
        Stores the public URL, Google client id, client secret and allowed
        domains in one atomic update. Omit `client_secret` to keep the stored
        one. Returns the redirect URI to register with Google. Requires a
        setup or recovery session.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupSignInUpdate"
      responses:
        "200":
          description: The sign-in settings after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSignIn"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/setup/google/start:
    get:
      operationId: startSetupGoogle
      summary: Sign in with Google to finish setup or recovery
      description: |
        Redirects to Google. After a successful sign-in during setup the
        account becomes the first admin and setup ends; during recovery the
        sign-in only confirms the settings. Requires a setup or recovery
        session.
      tags: [setup]
      security: []
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        default:
          $ref: "#/components/responses/Error"
  /api/auth/google/start:
    get:
      operationId: startGoogleSignIn
      summary: Sign in with Google
      description: Redirects to Google. `next` is where to return afterwards; only a path on this origin is accepted.
      tags: [auth]
      security: []
      parameters:
        - name: next
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        default:
          $ref: "#/components/responses/Error"
  /api/auth/google/callback:
    get:
      operationId: googleCallback
      summary: Google redirects here after sign-in
      description: |
        Verifies the sign-in (state, nonce, PKCE, the ID token's signature,
        issuer, audience and expiry, `email_verified` and the `hd` domain) and
        redirects: to the requested page with a session cookie on success, or
        to the sign-in or setup page with an `error` code on failure.
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: state
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: error
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        default:
          $ref: "#/components/responses/Error"
  /api/auth/signout:
    post:
      operationId: signOut
      summary: Sign out of this browser
      tags: [auth]
      responses:
        "204":
          description: The session was ended.
        default:
          $ref: "#/components/responses/Error"
  /api/auth/signout-everywhere:
    post:
      operationId: signOutEverywhere
      summary: Sign out of every browser
      description: Ends all of the caller's sessions. API tokens keep working.
      tags: [auth]
      responses:
        "204":
          description: Every session was ended.
        default:
          $ref: "#/components/responses/Error"
  /api/dev/login:
    post:
      operationId: devLogin
      summary: Development sign-in
      description: Only in `--dev` mode (loopback only); 404 otherwise. Signs in as any email with the chosen role.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLogin"
      responses:
        "204":
          description: Signed in; the session cookie is set.
        default:
          $ref: "#/components/responses/Error"
  /api/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [auth]
      responses:
        "200":
          description: The signed-in user and what they may do.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /api/users:
    get:
      operationId: listUsers
      summary: Every user, including removed ones
      description: Admin only.
      tags: [users]
      responses:
        "200":
          description: Users, ordered by email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Error"
  /api/users/{id}:
    patch:
      operationId: updateUser
      summary: Change a user's role
      description: Admin only. The last enabled admin cannot be demoted (409 last_admin).
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/users/{id}/remove:
    post:
      operationId: removeUser
      summary: Remove a user (offboarding)
      description: |
        In one transaction: marks the user removed, ends all their sessions,
        revokes all their API tokens permanently, and cancels their open
        changes. The record is kept. Admin only. The last enabled admin
        cannot be removed (409 last_admin).
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The user after removal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/users/{id}/restore:
    post:
      operationId: restoreUser
      summary: Restore a removed user
      description: The user can sign in again as a member. Revoked tokens stay revoked. Admin only.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The user after restoring.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /api/tokens:
    get:
      operationId: listTokens
      summary: API tokens
      description: The caller's active tokens. With `all=true` (admin only), every user's.
      tags: [tokens]
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Active tokens, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createToken
      summary: Create an API token
      description: The token is in this response only. Only its hash is stored.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
      responses:
        "201":
          description: The new token, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreated"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke an API token
      description: The owner or an admin. Revocation is permanent.
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: The token was revoked.
        default:
          $ref: "#/components/responses/Error"
  /api/settings:
    get:
      operationId: getSettings
      summary: Instance settings
      description: |
        Every registered setting with its current value, plus the status of
        the settings-related secrets. Secret values are never returned. Admin
        only.
      tags: [settings]
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettings
      summary: Change settings
      description: |
        Applies every change in the body, or none of them. A setting that is
        omitted is unchanged. For a secret: omitted means unchanged, a string
        replaces it, and `null` clears it. An invalid value fails the whole
        request with 422 and one entry per invalid field. Admin only.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: The settings after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/connectors:
    get:
      operationId: listConnectors
      summary: Available connectors
      description: |
        Every database product dbairlock can connect to, with the fields of
        its connection form. The dashboard renders the form from `fields`
        without connector-specific code. Any signed-in user.
      tags: [connections]
      responses:
        "200":
          description: Connectors, ordered by id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorList"
        default:
          $ref: "#/components/responses/Error"
  /api/connections:
    get:
      operationId: listConnections
      summary: Connections
      description: Every connection that is not archived, ordered by connector and name. Any signed-in user.
      tags: [connections]
      responses:
        "200":
          description: Connections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createConnection
      summary: Add a connection
      description: |
        The policy starts from the `policy.default_*` settings; fields in
        `policy` override them. The password goes to the secret store and is
        never returned. Names are unique across all connectors (409
        name_taken). Admin only.
      tags: [connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionCreate"
      responses:
        "201":
          description: The new connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/connections/test:
    post:
      operationId: testConnectionSettings
      summary: Test unsaved connection settings
      description: |
        Connects with the given settings, reads the server version and checks
        the user's privileges, without saving anything. With `connection_id`
        and no `password`, the saved password of that connection is used.
        A failure to connect is a result with `ok` false, not an error.
        Admin only.
      tags: [connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionTestRequest"
      responses:
        "200":
          description: The outcome of the test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/connections/{id}:
    get:
      operationId: getConnection
      summary: One connection
      description: Archived connections are returned too. Any signed-in user.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateConnection
      summary: Change a connection
      description: |
        Omitted fields are unchanged; `config`, when present, replaces the
        whole config. Changing the config or the password closes this
        connection's pool only. Archived connections cannot change (409
        archived). Admin only.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionUpdate"
      responses:
        "200":
          description: The connection after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/connections/{id}/archive:
    post:
      operationId: archiveConnection
      summary: Archive a connection
      description: |
        Hides the connection. Its history remains, its name becomes free and
        its password is removed from the secret store. Admin only.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The connection after archiving.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        default:
          $ref: "#/components/responses/Error"
  /api/connections/{id}/test:
    post:
      operationId: testConnection
      summary: Test a saved connection
      description: |
        Tests the saved connection with its saved password and records the
        outcome as its last test. A failure to connect is a result with `ok`
        false, not an error. Admin only.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The outcome of the test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/connections/{id}/schema:
    get:
      operationId: getConnectionSchema
      summary: The schema of a connection
      description: |
        Namespaces, tables, columns and primary keys, for the schema browser
        and editor autocomplete. Cached for 60 seconds. System schemas are
        never included. Any signed-in user. A target that cannot be reached
        answers 502 target_unavailable.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schema"
        "502":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/changes:
    get:
      operationId: listChanges
      summary: Changes
      description: |
        Changes, newest first, without row images. `view` picks a tab:
        `needs_my_review` (in review, not authored by the caller and not yet
        approved by them for the current SQL and preview), `mine` (authored
        by the caller) or `all`. Continue with `before` = the previous page's
        `next_before`. Any signed-in user.
      tags: [changes]
      parameters:
        - name: view
          in: query
          schema:
            type: string
            enum: [needs_my_review, mine, all]
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ChangeStatus"
        - name: connection_id
          in: query
          schema:
            type: string
            maxLength: 64
        - name: author_id
          in: query
          schema:
            type: string
            maxLength: 64
        - name: open
          in: query
          description: Only drafts, changes in review, approved and executing changes.
          schema:
            type: boolean
        - name: before
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: One page of changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createChange
      summary: Create a change
      description: |
        Without `submit` the change is saved as a draft, even when statements
        are invalid or the dry run fails (the problems are stored and shown).
        With `submit` it is created and submitted in one step: statements
        must pass validation and the dry run, or nothing is created (422
        `statements_invalid`, or 502 `target_unavailable`). If the caller
        already has an open change with identical SQL on the connection, that
        change is returned (200) with `already_existed` and nothing is
        created.
      tags: [changes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeCreate"
      responses:
        "200":
          description: An open change with identical SQL already existed; it is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "201":
          description: The new change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/changes/preview:
    post:
      operationId: previewChange
      summary: Preview statements
      description: |
        Validates the statements and, when all are valid, dry-runs them in
        one transaction that is always rolled back. Saves nothing. Every
        statement's outcome is reported. Any signed-in user.
      tags: [changes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePreviewRequest"
      responses:
        "200":
          description: The outcome; `ok` is false when something must be fixed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePreview"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/changes/{id}:
    get:
      operationId: getChange
      summary: One change
      description: |
        The change with its statements, previews (row images), reviews and
        executions. `id` is the change's id or its number. `server_time`
        lets the dashboard count the preview's age on the server's clock.
        Any signed-in user.
      tags: [changes]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateChange
      summary: Edit a change
      description: |
        The author edits a draft or a change in review. `revision` is the
        revision the edit is based on (409 `revision_conflict` if it moved).
        New statements get a new SQL hash and a new dry run, so earlier
        approvals no longer count. A change in review must keep passing
        validation and the dry run (422 `statements_invalid`).
      tags: [changes]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUpdate"
      responses:
        "200":
          description: The change after the edit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/changes/{id}/submit:
    post:
      operationId: submitChange
      summary: Submit a draft for review
      description: |
        Dry-runs the draft again and sends it for review. If the author
        already has an open change with identical SQL on the connection, that
        change is returned with `already_existed` and the draft stays a
        draft.
      tags: [changes]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRevision"
      responses:
        "200":
          description: The submitted change, or the existing one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/changes/{id}/cancel:
    post:
      operationId: cancelChange
      summary: Cancel a change
      description: The author or an admin cancels a draft, a change in review or an approved change.
      tags: [changes]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeCancel"
      responses:
        "200":
          description: The cancelled change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/changes/{id}/refresh-preview:
    post:
      operationId: refreshChangePreview
      summary: Update the preview
      description: |
        Re-runs the dry run of a change in review for its current SQL. When
        the affected rows or the values being overwritten differ from the
        previous preview, earlier approvals stop counting
        (`data_changed`). A failed dry run is stored and blocks approval.
        At most one update per change every 10 seconds (429). Any signed-in
        user.
      tags: [changes]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The outcome and the change afterwards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewRefresh"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/changes/{id}/reviews:
    post:
      operationId: reviewChange
      summary: Approve or reject a change
      description: |
        An approval carries the `sql_hash` and `preview_hash` the reviewer is
        looking at and needs a preview from the last
        `policy.preview_max_age_minutes` (409 `preview_stale`,
        `preview_failed`, `preview_changed` or `sql_changed`). A rejection
        needs a comment. The author cannot review (403 `self_review`).
      tags: [changes]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreate"
      responses:
        "200":
          description: The change after the review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/changes/{id}/execute:
    post:
      operationId: executeChange
      summary: Execute an approved change now
      description: |
        For connections that do not run approved changes automatically. The
        author or an admin.
      tags: [changes]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The change; the executor picks it up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/changes/{id}/retry:
    post:
      operationId: retryChange
      summary: Try a waiting change now
      description: |
        Clears the wait of an approved change whose database could not be
        reached, so the executor tries again at once. Admin only.
      tags: [changes]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/changes/{id}/events:
    get:
      operationId: listChangeEvents
      summary: The timeline of a change
      description: The change's audit events, oldest first. Any signed-in user.
      tags: [changes]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeEventList"
        default:
          $ref: "#/components/responses/Error"
  /api/audit:
    get:
      operationId: listAuditEvents
      summary: The audit log
      description: |
        Audit events, newest first, one page at a time. Every filter is
        optional; pass `next_before` from the previous page as `before` to
        continue. Any signed-in user.
      tags: [audit]
      parameters:
        - name: actor
          in: query
          description: The actor's email or user id, matched exactly.
          schema:
            type: string
            maxLength: 320
        - name: action
          in: query
          description: Action prefix, for example `change.` or `change.approved`.
          schema:
            type: string
            maxLength: 100
        - name: subject_type
          in: query
          schema:
            type: string
            maxLength: 64
        - name: subject_id
          in: query
          schema:
            type: string
            maxLength: 64
        - name: via
          in: query
          description: The channel the actor used.
          schema:
            $ref: "#/components/schemas/AuditVia"
        - name: from
          in: query
          description: Events at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Events before this time.
          schema:
            type: string
            format: date-time
        - name: before
          in: query
          description: Only events with a sequence number below this one.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        default:
          $ref: "#/components/responses/Error"
  /api/audit/verify:
    get:
      operationId: getAuditVerification
      summary: The latest chain verification
      description: |
        The verification running now, or the most recent one since the
        server started, and the last one that found the chain intact. Admin
        only.
      tags: [audit]
      responses:
        "200":
          description: Verification status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerification"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: verifyAudit
      summary: Verify the audit hash chain
      description: |
        Walks the whole chain and reports the first broken link. Answers
        when the check finishes, or after a second with `state: running` and
        the progress so far; poll GET /api/audit/verify until it is done.
        Joins a check that is already running. Records `audit.verified`.
        Admin only.
      tags: [audit]
      responses:
        "200":
          description: Verification status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerification"
        default:
          $ref: "#/components/responses/Error"
  /api/audit/export:
    get:
      operationId: exportAudit
      summary: Export the audit log
      description: |
        Streams every event in the time range as newline-delimited JSON,
        oldest first, with the hashes in hex so the chain can be checked
        elsewhere. Admin only.
      tags: [audit]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: One JSON event per line.
          content:
            application/x-ndjson:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/system:
    get:
      operationId: getSystem
      summary: System status
      description: Version, storage and counts of this instance. No secrets. Admin only.
      tags: [system]
      responses:
        "200":
          description: System status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/notifications:
    get:
      operationId: listNotifications
      summary: Recent notifications
      description: The newest queued notifications and their delivery outcome. Admin only.
      tags: [notifications]
      responses:
        "200":
          description: Notifications, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        default:
          $ref: "#/components/responses/Error"
  /api/notifications/test:
    post:
      operationId: sendTestNotification
      summary: Send a test notification
      description: |
        Posts a test event now to the saved webhook URL in the saved format,
        whether or not notifications are enabled. A receiver that fails is a
        result with `ok: false`. 409 when no webhook URL is set. Admin only.
      tags: [notifications]
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTestResult"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
  responses:
    Error:
      description: An error. The body is always the shared error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Redirect:
      description: A redirect.
      headers:
        Location:
          required: true
          schema:
            type: string
  schemas:
    SetupCode:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          writeOnly: true
          x-dbairlock-secret: true
          description: The one-time code; dashes and spaces are ignored.
    SetupSession:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [setup, recovery]
    SetupSignIn:
      type: object
      required: [public_url, suggested_public_url, client_id, client_secret, allowed_domains, redirect_uri]
      additionalProperties: false
      properties:
        public_url:
          type: string
          description: The stored public URL; empty until saved.
        suggested_public_url:
          type: string
          description: The address this request arrived on, offered for the admin to confirm.
        client_id:
          type: string
        client_secret:
          $ref: "#/components/schemas/SecretStatus"
        allowed_domains:
          type: array
          items:
            type: string
        redirect_uri:
          type: string
          description: The URI to register with Google; empty until the public URL is set.
    SetupSignInUpdate:
      type: object
      required: [public_url, client_id, allowed_domains]
      additionalProperties: false
      properties:
        public_url:
          type: string
          minLength: 1
          maxLength: 2048
        client_id:
          type: string
          minLength: 1
          maxLength: 255
        client_secret:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          x-dbairlock-secret: true
          description: Omit to keep the stored secret.
        allowed_domains:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            maxLength: 253
        oidc_issuer:
          type: string
          maxLength: 2048
          description: Not shown in the dashboard. Google's issuer, or a loopback address for tests.
    DevLogin:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        role:
          $ref: "#/components/schemas/Role"
    Role:
      type: string
      enum: [admin, member]
    Permission:
      type: string
      description: An action the user may take (see identity.Can).
      enum: [change.submit, change.review, change.administer, database.manage, settings.manage, user.manage, audit.read]
    User:
      type: object
      required: [id, email, name, role, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        picture_url:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
        last_sign_in_at:
          type: string
          format: date-time
        removed_at:
          type: string
          format: date-time
          description: Present when the user was removed.
        removed_by:
          type: string
    UserList:
      type: object
      required: [users]
      additionalProperties: false
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    UserUpdate:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/Role"
    Me:
      type: object
      required: [user, permissions]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    ApiToken:
      type: object
      required: [id, name, prefix, owner_id, owner_email, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the token, for recognising it. Never used for lookup.
        owner_id:
          type: string
        owner_email:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Absent for a token that does not expire.
    TokenList:
      type: object
      required: [tokens]
      additionalProperties: false
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
    TokenCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        expires_in_days:
          description: 30, 90 or 365; omit for a token that does not expire.
          type: integer
          enum: [30, 90, 365]
    TokenCreated:
      type: object
      required: [token, secret, mcp_url]
      additionalProperties: false
      properties:
        token:
          $ref: "#/components/schemas/ApiToken"
        secret:
          type: string
          description: The full token. Shown in this response only; it cannot be retrieved again.
        mcp_url:
          type: string
          description: The MCP endpoint to configure in an agent.
    Error:
      type: object
      description: The error envelope returned by every failing request.
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable machine-readable error code, for example `not_found`.
          examples: [not_found]
        message:
          type: string
          description: Human-readable message, safe to show to the user.
        fields:
          type: array
          description: Present on validation errors (`validation_failed`), one entry per invalid field.
          items:
            $ref: "#/components/schemas/FieldError"
        details:
          $ref: "#/components/schemas/ErrorDetails"
    ErrorDetails:
      type: object
      description: |
        Structured detail for some errors. `statements_invalid` carries every
        statement's problem (with its byte offset in the statement, for the
        editor) and the run's `problem`; `duplicate` carries the existing
        change.
      additionalProperties: false
      properties:
        statements:
          type: array
          items:
            $ref: "#/components/schemas/StatementIssue"
        problem:
          $ref: "#/components/schemas/ChangeIssue"
        change_id:
          type: string
        change_number:
          type: integer
          format: int64
    StatementIssue:
      type: object
      required: [statement, code, message, position]
      additionalProperties: false
      properties:
        statement:
          type: integer
          description: Zero-based index of the statement.
        code:
          type: string
        message:
          type: string
        position:
          type: integer
          description: Byte offset into the statement the message refers to, or -1.
    FieldError:
      type: object
      required: [field, message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: The invalid field, for example `auth.session_hours`.
        message:
          type: string
          description: Why it is invalid, safe to show to the user.
    SecretStatus:
      type: object
      description: |
        Whether a secret is set, and by whom and when. Responses carry this
        instead of a secret; nothing derived from the value (no length, hash
        or preview) is ever included.
      required: [is_set]
      additionalProperties: false
      properties:
        is_set:
          type: boolean
        set_by:
          type: string
          description: Who last set the secret. Present when `is_set` is true.
        set_at:
          type: string
          format: date-time
          description: When the secret was last set. Present when `is_set` is true.
    Settings:
      type: object
      required: [values, secrets]
      additionalProperties: false
      properties:
        values:
          $ref: "#/components/schemas/SettingValues"
        secrets:
          $ref: "#/components/schemas/SettingsSecretStatus"
    SettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        values:
          $ref: "#/components/schemas/SettingValuesPatch"
        secrets:
          $ref: "#/components/schemas/SettingsSecretsPatch"
    SettingsSecretStatus:
      type: object
      required: [auth.google.client_secret, notify.webhook_url]
      additionalProperties: false
      properties:
        auth.google.client_secret:
          $ref: "#/components/schemas/SecretStatus"
        notify.webhook_url:
          $ref: "#/components/schemas/SecretStatus"
    SettingsSecretsPatch:
      type: object
      description: |
        Secret updates: omit a field to leave it unchanged, send a string to
        replace it, or send `null` to clear it.
      additionalProperties: false
      properties:
        auth.google.client_secret:
          type: [string, "null"]
          writeOnly: true
          x-dbairlock-secret: true
          minLength: 1
          maxLength: 4096
          description: The Google OAuth client secret.
        notify.webhook_url:
          type: [string, "null"]
          writeOnly: true
          x-dbairlock-secret: true
          minLength: 1
          maxLength: 4096
          description: The webhook URL notifications are posted to. A secret because chat webhook URLs embed a credential.
    SettingValues:
      type: object
      description: Every registered setting. Bounds mirror the registry in internal/settings (a contract test keeps them equal).
      required:
        - instance.name
        - instance.public_url
        - instance.trusted_proxies
        - auth.google.client_id
        - auth.allowed_domains
        - auth.session_hours
        - auth.oidc_issuer
        - policy.default_required_approvals
        - policy.default_max_rows
        - policy.default_approval_ttl_hours
        - policy.default_store_row_images
        - policy.default_auto_execute
        - policy.preview_max_age_minutes
        - limits.statement_timeout_ms
        - limits.lock_timeout_ms
        - limits.mcp_calls_per_minute
        - limits.mcp_previews_per_hour
        - limits.mcp_submissions_per_hour
        - notify.enabled
        - notify.format
        - notify.events
      additionalProperties: false
      properties: &settingValueProperties
        instance.name:
          type: string
          minLength: 1
          maxLength: 64
          description: Shown in the dashboard and on the sign-in page.
        instance.public_url:
          type: string
          maxLength: 2048
          description: The URL people use to reach dbairlock; empty until setup captures it.
        instance.trusted_proxies:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 49
          description: CIDR ranges of reverse proxies whose X-Forwarded-For header is trusted for the client address.
        auth.oidc_issuer:
          type: string
          minLength: 1
          maxLength: 2048
          description: Google's issuer. Another issuer is accepted only on a loopback address, for tests.
        auth.google.client_id:
          type: string
          maxLength: 255
        auth.allowed_domains:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 253
          description: Google Workspace domains whose accounts may sign in.
        auth.session_hours:
          type: integer
          minimum: 1
          maximum: 720
        policy.default_required_approvals:
          type: integer
          minimum: 1
          maximum: 5
        policy.default_max_rows:
          type: integer
          minimum: 1
          maximum: 10000
        policy.default_approval_ttl_hours:
          type: integer
          minimum: 1
          maximum: 720
        policy.default_store_row_images:
          type: boolean
        policy.default_auto_execute:
          type: boolean
        policy.preview_max_age_minutes:
          type: integer
          minimum: 1
          maximum: 60
        limits.statement_timeout_ms:
          type: integer
          minimum: 100
          maximum: 300000
        limits.lock_timeout_ms:
          type: integer
          minimum: 100
          maximum: 60000
        limits.mcp_calls_per_minute:
          type: integer
          minimum: 1
          maximum: 1000
          description: MCP tool calls each API token may make per minute.
        limits.mcp_previews_per_hour:
          type: integer
          minimum: 1
          maximum: 1000
          description: MCP preview_change calls (dry runs on the target) each API token may make per hour.
        limits.mcp_submissions_per_hour:
          type: integer
          minimum: 1
          maximum: 1000
          description: MCP submit_change calls each API token may make per hour.
        notify.enabled:
          type: boolean
        notify.format:
          type: string
          enum: [generic, slack]
          minLength: 1
          maxLength: 16
          description: The webhook body. `generic` posts one flat JSON object; `slack` posts what Slack incoming webhooks accept.
        notify.events:
          type: array
          maxItems: 5
          items:
            type: string
            enum: [change.submitted, change.approved, change.rejected, change.executed, change.failed]
            maxLength: 32
          description: The events that are sent.
    SettingValuesPatch:
      type: object
      description: The settings to change; omitted settings are unchanged.
      additionalProperties: false
      properties: *settingValueProperties
    ConnectorField:
      type: object
      description: One input of a connection form, declared by the connector.
      required: [key, label, type, required]
      additionalProperties: false
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          description: |
            `text` is a multi-line string. A `secret` field is the
            connection's password: it is sent as `password`, never in
            `config`, and never returned.
          enum: [string, text, int, enum, bool, secret]
        required:
          type: boolean
        default:
          description: The default value (a string, number or boolean).
        options:
          type: array
          description: The choices of an `enum` field.
          items:
            type: string
        help:
          type: string
    Connector:
      type: object
      required: [id, display_name, dialect, default_port, fields]
      additionalProperties: false
      properties:
        id:
          type: string
          examples: [postgres]
        display_name:
          type: string
          examples: [PostgreSQL]
        dialect:
          type: string
          description: The SQL editor dialect, for example `postgresql` or `mysql`.
        default_port:
          type: integer
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorField"
    ConnectorList:
      type: object
      required: [connectors, default_allowed_functions]
      additionalProperties: false
      properties:
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/Connector"
        default_allowed_functions:
          type: array
          description: The function allowlist a new connection starts with.
          items:
            type: string
    ConnectionConfig:
      type: object
      description: The connector's non-secret fields, keyed by field key. Values are strings, integers or booleans.
      maxProperties: 50
      additionalProperties: true
    ConnectionPolicy:
      type: object
      description: The review policy of one connection. Bounds mirror the `policy.default_*` settings.
      required: [required_approvals, max_rows, approval_ttl_hours, store_row_images, auto_execute, allowed_functions]
      additionalProperties: false
      properties: &connectionPolicyProperties
        required_approvals:
          type: integer
          minimum: 1
          maximum: 5
          description: Approvals needed before a change runs. The author never counts.
        max_rows:
          type: integer
          minimum: 1
          maximum: 10000
          description: A statement may affect at most this many rows.
        approval_ttl_hours:
          type: integer
          minimum: 1
          maximum: 720
          description: How long a change may wait for review before it expires.
        store_row_images:
          type: boolean
          description: Keep the before and after rows of each change. When off, only column names and counts are kept.
        auto_execute:
          type: boolean
          description: Run a change as soon as its last required approval lands.
        allowed_functions:
          type: array
          maxItems: 100
          description: Lower-case names of the functions statements may call.
          items:
            type: string
            maxLength: 63
    ConnectionPolicyPatch:
      type: object
      description: Policy fields to change; omitted fields are unchanged (on create, taken from the defaults).
      additionalProperties: false
      properties: *connectionPolicyProperties
    ConnectionName:
      type: string
      minLength: 1
      maxLength: 63
      pattern: "^[a-z0-9]([a-z0-9_-]{0,61}[a-z0-9])?$"
      description: Unique across all connectors; agents refer to a connection by name alone.
    ServerInfo:
      type: object
      required: [product, version, major, supported]
      additionalProperties: false
      properties:
        product:
          type: string
        version:
          type: string
        major:
          type: integer
        supported:
          type: boolean
          description: The version is one the vendor still maintains.
    ExcessPrivilege:
      type: object
      required: [privilege, detail]
      additionalProperties: false
      properties:
        privilege:
          type: string
          examples: [SUPERUSER]
        detail:
          type: string
        fix:
          type: string
          description: A statement an admin can run on the target to remove the privilege.
    PrivilegeReport:
      type: object
      required: [user, can_select, can_insert, can_update, can_delete, excess]
      additionalProperties: false
      properties:
        user:
          type: string
        can_select:
          type: boolean
        can_insert:
          type: boolean
        can_update:
          type: boolean
        can_delete:
          type: boolean
        excess:
          type: array
          description: Privileges beyond SELECT, INSERT, UPDATE and DELETE.
          items:
            $ref: "#/components/schemas/ExcessPrivilege"
    ConnectionTestResult:
      type: object
      required: [ok, tested_at, warnings]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          description: The target could be reached and authenticated to.
        tested_at:
          type: string
          format: date-time
        message:
          type: string
          description: Why the test failed. Present when `ok` is false.
        server:
          $ref: "#/components/schemas/ServerInfo"
        privileges:
          $ref: "#/components/schemas/PrivilegeReport"
        warnings:
          type: array
          description: Problems that do not stop the connection from working.
          items:
            type: string
    ConnectionTestRequest:
      type: object
      required: [connector, config]
      additionalProperties: false
      properties:
        connector:
          type: string
          maxLength: 64
        config:
          $ref: "#/components/schemas/ConnectionConfig"
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          x-dbairlock-secret: true
          description: Omit, with `connection_id`, to use the saved password.
        connection_id:
          type: string
          maxLength: 64
          description: A saved connection whose password to use when `password` is omitted.
    Connection:
      type: object
      required: [id, name, description, connector, config, policy, password, created_by, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        connector:
          type: string
        config:
          $ref: "#/components/schemas/ConnectionConfig"
        policy:
          $ref: "#/components/schemas/ConnectionPolicy"
        password:
          $ref: "#/components/schemas/SecretStatus"
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
        archived_by:
          type: string
        last_test:
          $ref: "#/components/schemas/ConnectionTestResult"
    ConnectionList:
      type: object
      required: [connections]
      additionalProperties: false
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
    ConnectionCreate:
      type: object
      required: [name, connector, config, password]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/ConnectionName"
        description:
          type: string
          maxLength: 500
          description: What this database holds and when to use it. Agents read it to decide where a change belongs.
        connector:
          type: string
          maxLength: 64
        config:
          $ref: "#/components/schemas/ConnectionConfig"
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          x-dbairlock-secret: true
        policy:
          $ref: "#/components/schemas/ConnectionPolicyPatch"
    ConnectionUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/ConnectionName"
        description:
          type: string
          maxLength: 500
        config:
          $ref: "#/components/schemas/ConnectionConfig"
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          x-dbairlock-secret: true
          description: Omit to keep the saved password. A connection always has one, so it cannot be cleared.
        policy:
          $ref: "#/components/schemas/ConnectionPolicyPatch"
    SchemaColumn:
      type: object
      required: [name, type, nullable]
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          type: string
        nullable:
          type: boolean
    SchemaTable:
      type: object
      required: [name, columns, primary_key]
      additionalProperties: false
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/SchemaColumn"
        primary_key:
          type: array
          description: Column names of the primary key, in key order; empty when the table has none.
          items:
            type: string
    SchemaNamespace:
      type: object
      required: [name, tables]
      additionalProperties: false
      properties:
        name:
          type: string
          description: A Postgres schema, or the MySQL database.
        tables:
          type: array
          items:
            $ref: "#/components/schemas/SchemaTable"
    Schema:
      type: object
      required: [namespaces]
      additionalProperties: false
      properties:
        namespaces:
          type: array
          items:
            $ref: "#/components/schemas/SchemaNamespace"
    ChangeStatus:
      type: string
      enum: [draft, pending_review, approved, executing, executed, failed, rejected, expired, cancelled]
    StatementKind:
      type: string
      enum: [insert, update, delete]
    ChangePerson:
      type: object
      required: [id, email, name, removed]
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        removed:
          type: boolean
    ChangeConnection:
      type: object
      required: [id, name, connector]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        connector:
          type: string
    ChangeIssue:
      type: object
      description: Why a statement or a dry run failed. Plain text.
      required: [code, message, position]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        position:
          type: integer
          description: Byte offset into the statement the message refers to, or -1.
    Cell:
      description: |
        A cell value: null, a boolean, a number, a string, a JSON array or
        object, or `{type, value, size, truncated}` for binary data and
        values truncated for display. Always rendered as plain text.
    RowPreview:
      type: object
      description: |
        What a dry run (or execution) found for one statement. `before` and
        `after` are present only when `row_images` is true; rows follow
        `columns`.
      required: [rows_affected, has_primary_key, primary_key, columns, truncated, row_images]
      additionalProperties: false
      properties:
        rows_affected:
          type: integer
          format: int64
        fingerprint:
          type: string
        has_primary_key:
          type: boolean
        primary_key:
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            type: string
        before:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Cell"
        after:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Cell"
        truncated:
          type: boolean
        row_images:
          type: boolean
        session:
          type: object
          additionalProperties:
            type: string
    ChangeStatement:
      type: object
      required: [position, sql, schema, table, has_primary_key]
      additionalProperties: false
      properties:
        position:
          type: integer
        sql:
          type: string
        kind:
          $ref: "#/components/schemas/StatementKind"
        schema:
          type: string
        table:
          type: string
        expected_rows:
          type: integer
          format: int64
        fingerprint:
          type: string
        has_primary_key:
          type: boolean
        issue:
          $ref: "#/components/schemas/ChangeIssue"
        preview:
          $ref: "#/components/schemas/RowPreview"
        previous_preview:
          $ref: "#/components/schemas/RowPreview"
    ChangeReview:
      type: object
      required: [id, reviewer, decision, comment, sql_hash, preview_hash, revision, created_at, counts]
      additionalProperties: false
      properties:
        id:
          type: string
        reviewer:
          $ref: "#/components/schemas/ChangePerson"
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
        sql_hash:
          type: string
        preview_hash:
          type: string
        revision:
          type: integer
        created_at:
          type: string
          format: date-time
        counts:
          type: boolean
          description: True for an approval that counts towards the required number now.
        outdated:
          type: string
          enum: [sql_changed, preview_changed, reviewer_removed]
          description: Why an approval no longer counts.
    ChangeDrift:
      type: object
      required: [kind, statement, expected, actual]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [rows, count]
        statement:
          type: integer
        expected:
          type: string
        actual:
          type: string
    ExecutionResult:
      type: object
      required: [position, schema, table, preview]
      additionalProperties: false
      properties:
        position:
          type: integer
        schema:
          type: string
        table:
          type: string
        preview:
          $ref: "#/components/schemas/RowPreview"
    ChangeExecution:
      type: object
      required: [id, attempt, started_at, outcome, results]
      additionalProperties: false
      properties:
        id:
          type: string
        attempt:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [running, executed, failed, not_started, interrupted]
        error_code:
          type: string
        error_message:
          type: string
        drift:
          $ref: "#/components/schemas/ChangeDrift"
        results:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionResult"
    ChangeActions:
      type: object
      description: What the caller may do with the change now. The server checks every action again.
      required: [edit, submit, cancel, approve, reject, refresh_preview, execute_now, retry_now]
      additionalProperties: false
      properties:
        edit:
          type: boolean
        submit:
          type: boolean
        cancel:
          type: boolean
        approve:
          type: boolean
        reject:
          type: boolean
        refresh_preview:
          type: boolean
        execute_now:
          type: boolean
        retry_now:
          type: boolean
    ChangeSummary:
      type: object
      required: [id, number, connection, author, via, title, status, revision, attempts, statements, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
        number:
          type: integer
          format: int64
        connection:
          $ref: "#/components/schemas/ChangeConnection"
        author:
          $ref: "#/components/schemas/ChangePerson"
        via:
          type: string
          enum: [web, mcp]
          description: "`mcp` when an agent submitted it with the author's API token."
        agent_name:
          type: string
          description: The name of the API token an agent used.
        title:
          type: string
        status:
          $ref: "#/components/schemas/ChangeStatus"
        status_code:
          type: string
        status_detail:
          type: string
        revision:
          type: integer
        attempts:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
        statements:
          type: array
          items:
            $ref: "#/components/schemas/ChangeStatement"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
    Change:
      type: object
      required:
        - id
        - number
        - connection
        - author
        - via
        - title
        - reason
        - status
        - revision
        - sql_hash
        - preview_hash
        - preview_changed
        - preview_max_age_seconds
        - server_time
        - required_approvals
        - approvals
        - auto_execute
        - store_row_images
        - attempts
        - execute_requested
        - statements
        - reviews
        - executions
        - actions
        - already_existed
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
        number:
          type: integer
          format: int64
        connection:
          $ref: "#/components/schemas/ChangeConnection"
        author:
          $ref: "#/components/schemas/ChangePerson"
        via:
          type: string
          enum: [web, mcp]
        agent_name:
          type: string
        title:
          type: string
        reason:
          type: string
        status:
          $ref: "#/components/schemas/ChangeStatus"
        status_code:
          type: string
          description: Why the change is in its status, for example `drift`, `interrupted`, `author_removed`.
        status_detail:
          type: string
          description: For a drift, its kind (`rows` or `count`).
        status_message:
          type: string
        revision:
          type: integer
        sql_hash:
          type: string
        preview_hash:
          type: string
        previewed_at:
          type: string
          format: date-time
        preview_error:
          type: string
