        next_attempt_at:
          type: string
          format: date-time
        last_attempt_error:
          type: string
        execute_requested:
          type: boolean
        statements:
          type: array
          items:
            $ref: "#/components/schemas/ChangeStatement"
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/ChangeReview"
        executions:
          type: array
          items:
            $ref: "#/components/schemas/ChangeExecution"
        actions:
          $ref: "#/components/schemas/ChangeActions"
        already_existed:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
        executed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    ChangeList:
      type: object
      required: [changes, needs_my_review]
