      required: [seq, id, occurred_at, actor, action, subject_type, subject_id, payload, prev_hash, hash]
      additionalProperties: false
      properties:
        seq:
          type: integer
          format: int64
        id:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/AuditActor"
        action:
          type: string
        subject_type:
          type: string
        subject_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        prev_hash:
          type: string
          description: SHA-256 of the previous event, hex.
        hash:
          type: string
          description: SHA-256 of the previous hash and this event, hex.
    AuditEventList:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_before:
          type: integer
          format: int64
          description: Pass as `before` for the next page; absent on the last page.
    AuditProblem:
      type: object
      required: [seq, reason]
      additionalProperties: false
      properties:
        seq:
          type: integer
          format: int64
          description: Sequence number of the first broken link.
        reason:
          type: string
    AuditLastSuccess:
      type: object
      required: [at, by, checked]
