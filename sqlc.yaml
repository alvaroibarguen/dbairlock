# sqlc configuration: one output package per module, all reading the one
# ordered migration folder as their schema. Run with `make generate`.
version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/audit/queries.sql
    gen:
      go:
        package: auditdb
        out: internal/audit/auditdb
        emit_empty_slices: true
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/secrets/queries.sql
    gen:
      go:
        package: secretsdb
        out: internal/secrets/secretsdb
        emit_empty_slices: true
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/settings/queries.sql
    gen:
      go:
        package: settingsdb
        out: internal/settings/settingsdb
        emit_empty_slices: true
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/setup/queries.sql
    gen:
      go:
        package: setupdb
        out: internal/setup/setupdb
        emit_empty_slices: true
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/identity/queries.sql
    gen:
      go:
        package: identitydb
        out: internal/identity/identitydb
        emit_empty_slices: true
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/targets/queries.sql
    gen:
      go:
        package: targetsdb
        out: internal/targets/targetsdb
        emit_empty_slices: true
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/changes/queries.sql
    gen:
      go:
        package: changesdb
        out: internal/changes/changesdb
        emit_empty_slices: true
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/notify/queries.sql
    gen:
      go:
        package: notifydb
        out: internal/notify/notifydb
        emit_empty_slices: true
