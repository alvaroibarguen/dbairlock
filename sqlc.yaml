# sqlc configuration: one output package per module, all reading the one
# ordered migration folder as their schema. Run with `make generate`.
version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/audit/queries.sql
    gen:
      go:
        package: auditdb
        out: internal/audit/auditdb
        emit_empty_slices: true
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/secrets/queries.sql
    gen:
      go:
        package: secretsdb
        out: internal/secrets/secretsdb
        emit_empty_slices: true
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/settings/queries.sql
    gen:
      go:
        package: settingsdb
        out: internal/settings/settingsdb
        emit_empty_slices: true
